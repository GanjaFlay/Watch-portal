html,body{margin:0;background:#fff;color:#1d2a2a;font-family:'Outfit',system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;overflow-x:hidden}
.sim-title{font-weight:300;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#0ABAB5;margin:0 0 6px;padding-left:.3em}
.watch{--d:300px;position:relative;width:calc(var(--d)*1.22);height:calc(var(--d)*2.05);display:flex;align-items:center;justify-content:center;transition:all .5s ease}
.strap{position:absolute;left:50%;width:calc(var(--d)*.62);margin-left:calc(var(--d)*-.31);height:calc(var(--d)*.62);
  background:linear-gradient(90deg,#1b1f20,#2c3233 30%,#2a3031 70%,#171a1b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.strap.top{top:0;border-radius:calc(var(--d)*.06) calc(var(--d)*.06) 0 0;-webkit-mask:linear-gradient(to top,#000 55%,transparent);mask:linear-gradient(to top,#000 55%,transparent)}
.strap.bot{bottom:0;border-radius:0 0 calc(var(--d)*.06) calc(var(--d)*.06);-webkit-mask:linear-gradient(to bottom,#000 55%,transparent);mask:linear-gradient(to bottom,#000 55%,transparent)}
.case{position:relative;width:calc(var(--d)*1.19);height:calc(var(--d)*1.19);border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#5b6264,#2a2f31 45%,#141718 75%);
  box-shadow:0 calc(var(--d)*.05) calc(var(--d)*.12) rgba(0,0,0,.28),0 calc(var(--d)*.01) calc(var(--d)*.02) rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center}
.btn-side{position:absolute;right:calc(var(--d)*-.025);width:calc(var(--d)*.04);height:calc(var(--d)*.11);border-radius:calc(var(--d)*.02);background:linear-gradient(90deg,#2a2f31,#4a5153)}
.btn-side.b1{top:32%}.btn-side.b2{top:57%}
.glass{position:relative;width:calc(var(--d)*1.05);height:calc(var(--d)*1.05);border-radius:50%;background:#000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.display{position:relative;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;-webkit-clip-path:circle(50%);clip-path:circle(50%);background:#000}
.display>.scaler{position:absolute;left:0;top:0;width:438px;height:438px;transform-origin:0 0}
.glare{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%)}
.caption{margin-top:10px;font-weight:300;font-size:14px;letter-spacing:.06em;color:#4a5a5a;text-align:center}
.hint{font-size:12px;color:#8a9a9a;margin-top:4px;text-align:center;padding:0 16px}
.toggle{margin-top:14px;font:inherit;font-size:14px;letter-spacing:.08em;padding:9px 22px;border-radius:999px;border:1px solid #0ABAB5;color:#0a8c88;background:#fff;cursor:pointer}
.toggle[aria-pressed="true"]{background:#0ABAB5;color:#fff}

/* ===== Bitcoin panel — native 438x438 ===== */
.bt-face{--bg:#000;--ink:#eafaf8;--accent:#0ABAB5;--soft:#81D8D0;--down:#F2A39B;--muted:rgba(129,216,208,.55);--track:rgba(129,216,208,.10);
  position:relative;width:438px;height:438px;border-radius:50%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer;contain:strict}
.bt-face canvas{position:absolute;inset:0;width:438px;height:438px;pointer-events:none}
.bt-face svg.bt-ring{position:absolute;inset:0;pointer-events:none;overflow:visible}
.bt-track{stroke:var(--track)} .bt-arc{stroke:var(--accent);transition:stroke .6s}
.bt-face.bt-dn .bt-arc{stroke:var(--down)} .bt-dot{fill:var(--soft);transition:fill .6s} .bt-face.bt-dn .bt-dot{fill:var(--down)} .bt-tick{stroke:var(--muted)}
.bt-head{position:absolute;left:0;right:0;top:66px;display:flex;justify-content:center;align-items:center;gap:7px;
  font-size:12px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);padding-left:.32em}
.bt-head svg{width:15px;height:15px;color:var(--accent)}
.bt-rng{position:absolute;left:0;right:0;top:94px;display:flex;justify-content:center;gap:18px;font-size:12px;font-weight:300;letter-spacing:.18em;color:var(--muted)}
.bt-rng span{padding:2px 0 4px;border-bottom:1px solid transparent;transition:color .4s,border-color .4s}
.bt-rng span.on{color:var(--soft);border-bottom-color:var(--accent)}
.bt-price{position:absolute;left:0;right:0;top:122px;text-align:center;font-weight:200;font-size:62px;line-height:70px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.bt-price small{font-size:30px;font-weight:200;margin-left:6px;color:var(--soft)}
.bt-chg{position:absolute;left:0;right:0;top:196px;text-align:center;font-size:16px;font-weight:300;letter-spacing:.08em;color:var(--accent);transition:color .6s}
.bt-chg i{font-style:normal;color:var(--muted);font-size:12px;letter-spacing:.2em;margin-left:8px;text-transform:uppercase}
.bt-face.bt-dn .bt-chg{color:var(--down)}
.bt-foot{position:absolute;left:0;right:0;top:366px;text-align:center;font-size:11px;font-weight:300;letter-spacing:.16em;color:var(--muted)}
.bt-face.bt-loading .bt-price,.bt-face.bt-loading .bt-chg{animation:bt-breath 1.6s ease-in-out infinite}
@keyframes bt-breath{50%{opacity:.35}}
</style></head>
