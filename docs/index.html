<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Watch Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root { --safe: 14.6vmin; --accent: #0ABAB5; --soft: #81D8D0; --ink: #eafaf8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: var(--ink);
    font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  .round {
    width: 100vmin; height: 100vmin; border-radius: 50%;
    padding: var(--safe);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  header { display: flex; flex-direction: column; align-items: center; gap: .5vmin; margin-bottom: 1.8vmin; }
  .leaf { width: 6.4vmin; height: 8vmin; color: var(--accent); }
  .brand {
    margin: 0; font-weight: 300; font-size: 3.1vmin; letter-spacing: .42em;
    text-transform: uppercase; color: var(--soft); padding-left: .42em;
  }
  nav { width: 100%; display: flex; flex-direction: column; gap: 1.7vmin; }
  nav a {
    display: flex; align-items: center; justify-content: center;
    min-height: 11.2vmin; padding: 0 2vmin;
    border-radius: 999px; border: 1px solid rgba(10,186,181,.7);
    color: var(--soft); text-decoration: none;
    font-weight: 300; font-size: 4.2vmin; letter-spacing: .01em;
  }
  nav a:active { background: var(--accent); color: #04110f; }
  .live {
    margin-top: 1.6vmin;
    color: rgba(129,216,208,.5);
    font-size: 2.7vmin; font-weight: 300; letter-spacing: .06em;
    text-decoration: none;
  }
  .live:active { color: var(--soft); }
  .sims {
    margin-top: 1.3vmin;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: .2vmin 2vmin; max-width: 100%;
    font-size: 2.45vmin; font-weight: 300; letter-spacing: .04em;
    color: rgba(129,216,208,.4);
  }
  .sims span {
    width: 100%; text-transform: uppercase; letter-spacing: .24em;
    font-size: 2.15vmin; padding-left: .24em;
  }
  .sims a { color: inherit; text-decoration: none; }
  .sims a:active { color: var(--soft); }
</style>
</head>
<body>

      </svg>
      <p class="brand">Portal</p>

</html>
